name: wefilling
description: "함께하면 즐거운 대학 생활 - 위필링"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.61+73

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase
  firebase_core: 4.4.0
  firebase_auth: 6.1.4
  firebase_messaging: 16.1.1
  firebase_crashlytics: 5.0.7
  firebase_storage: 13.0.6
  firebase_remote_config: 6.1.4
  cloud_firestore: 6.1.2
  cloud_functions: 6.0.6
  
  # Social Login
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.3
  
  # UI & Utilities
  cupertino_icons: ^1.0.8
  provider: ^6.0.5  # 상태 관리용
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.1.14
  shared_preferences: ^2.2.2
  timezone: ^0.10.1
  webview_flutter: ^4.4.2
  image_picker: ^1.0.4
  # Android gallery actions are forced through the system Photo Picker.
  image_picker_android: ^0.8.13+3
  image_picker_platform_interface: ^2.11.0
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  visibility_detector: 0.4.0+2
  uuid: ^4.5.1
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.1
  path: ^1.8.3
  http: ^1.1.0
  crypto: ^3.0.6
  flutter_linkify: ^6.0.0
  google_fonts: ^6.1.0
  google_mlkit_language_id: ^0.15.1
  google_mlkit_translation: ^0.15.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  app_badge_plus: ^1.2.6
  
  # Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  linkify: ^5.0.0
  wechat_assets_picker: ^10.1.0
  # Keep Android 13+ image-only and Android 14 limited-photo permissions
  # aligned with the gallery request made by the Create Snack screen.
  photo_manager: 3.11.0
  table_calendar: ^3.1.3
  firebase_app_check: 0.4.1+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^2.0.3
  
  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # 단일 "원본(1024x1024)"만 관리하고, 나머지는 자동 생성
  image_path: "assets/app_icon/wefilling_app_icon_1024.png"
  image_path_ios: "assets/app_icon/wefilling_app_icon_1024.png"
  image_path_android: "assets/app_icon/wefilling_app_icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/wefilling_app_icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  # Both flavors use the service applicationId; plain `flutter run` therefore
  # installs com.wefilling.app while retaining the existing flavor task names.
  default-flavor: development
  generate: true  # Add this line for l10n support
  config:
    enable-lldb-debugging: false
    # iOS plugins are managed by CocoaPods in this project. Keeping Flutter's
    # generated Swift package disabled prevents its manifest from reverting to
    # an iOS 13 deployment target when dependencies are regenerated.
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
      - assets/
      - assets/icons/
      - assets/images/
      - assets/images/post_categories/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Variable.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR/NotoSansKR-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 900
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/PretendardJP-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard/PretendardJP-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard/PretendardJP-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard/PretendardJP-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard/PretendardJP-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard/PretendardJP-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard/PretendardJP-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard/PretendardJP-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard/PretendardJP-Black.otf
          weight: 900
    - family: HancomMalrangmalrang
      fonts:
        - asset: assets/fonts/HancomMalrangmalrang/HancomMalangMalang-Regular.otf
          weight: 400
        - asset: assets/fonts/HancomMalrangmalrang/HancomMalangMalang-Bold.otf
          weight: 700
